<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../global.css">
        <link rel="stylesheet" href="mobileglobal.css">
        <link rel="stylesheet" href="../fonts.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="icon" type="image/x-icon" href="../assets/images/favicon.png">
        <title>aero on mobile</title>
    </head>
    <body>
        <div class='background'>
            <video autoplay muted loop playsinline>
                <source src="../assets/images/full-size-crackround.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div id='mobilecontent'>
            <img class='panel' id='mobilelogo' src='../assets/images/largepfp.png'>
            <img id='arrow' src='arrow.png'>
            <div id='aboutTitle'>
                <div id='aboutTitleHighlight'>
                    <p>// about me</p>
                </div>
            </div>
            <div class='panel' id='aboutText'>
                <div id='aboutTextHighlight'>
                    <p>musician / sometimes artist / sometimes developer from stl</p>
                    <p>number 1 owen</p>
                </div>
            </div>
            <div class='panel' id='linksTitle'>
                <div id='linksTitleHighlight'>
                    <p>// links</p>
                </div>
            </div>
            <div id='linkdiv'>
                <a class='panel lbutton' id='b1' href='https://aerogelangels.bandcamp.com/album/infinite-chrysalis' target='_blank'>
                    <i class="fa fa-bandcamp"></i>
                </a>
                <a class='panel lbutton' id='b2' href='https://open.spotify.com/artist/6LG4Ry5JG4tnO9EperxNzm' target='_blank'>
                    <i class="fa fa-spotify"></i>
                </a>
                <a class='panel lbutton' id='b3' href='https://music.apple.com/us/artist/aerogelangels/1829000869' target='_blank'>
                    <i class="fa fa-apple"></i>
                </a>
                <a class='disabled panel lbutton' id='b4'></a>
                <a class='panel lbutton' id='b5' href='https://www.youtube.com/channel/UCarpaBQfMubdXgqSUdcd05Q' target='_blank'>
                    <i class="fa fa-youtube-play"></i>
                </a>
                <a class='panel lbutton' id='b6' href='https://soundcloud.com/aerogelangels' target='_blank'>
                    <i class="fa fa-soundcloud"></i>
                </a>
                <a class='panel lbutton' id='b7' href='https://www.instagram.com/aerogelangels/' target='_blank'>
                    <i class='fa fa-instagram'></i>
                </a>
                <a class='disabled panel lbutton' id='b8'></a>               
            </div>
            <div class='panel' id='qnaTitle'>
                <div id='qnaTitleHighlight'>
                    <p>// ask me</p>
                </div>
            </div>
            <div class='panel' id='disclaimer'>
                <div id='disclaimerHighlight'>
                    <p>To view older questions and see way, way more, visit the site on computer!</p>
                </div>
            </div>
            <div class='panel answers'>
                <iframe src='../about/qpages/q0.html'></iframe>
            </div>
            <div class='panel askme'>
                <form id='qform'>
                    <textarea name='question' required placeholder='ask me a question!'></textarea>
                    <button type='submit' id='qsubmit'>submit</button>
                </form>
            </div>
            <div id='bottomblankspacediv'></div>
        </div>
        <a class='copyscork' id='mobilecopy' href='https://n0thanky0u.neocities.org/license.txt'>
            <img src='../assets/images/copyscork.png'>
        </a>
    </body>
</html>
