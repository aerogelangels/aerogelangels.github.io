<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ep.css">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script defer>
        function showInfo() {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('info').classList.remove('hidden');
        }

        function showListen() {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('listen').classList.remove('hidden');
        }

        function showStems() {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('stems').classList.remove('hidden');
        }

        function hideInfo() {
            document.getElementById('info').classList.add('hidden');
            document.getElementById('home').classList.remove('hidden');
        }

        function hideListen() {
            document.getElementById('listen').classList.add('hidden');
            document.getElementById('home').classList.remove('hidden');
        }

        function hideStems() {
            document.getElementById('stems').classList.add('hidden');
            document.getElementById('home').classList.remove('hidden');
        }
    </script>
</head>

<body>
    <div id="content">
        <div id="home">
            <div class="link" onclick="showInfo()">🗊 Info</div><br>
            <div class="link" onclick="showListen()">🎜 Listen</div><br>
        </div>
        <div id="info" class="hidden">
            <div class="text">
                <b>Name</b>: "Aerogel Angels EP"
                <br><br>
                <b>Release date</b>: 5/24/24
                <br><br>
                <b>Length</b>: 5 songs, 18 min, 3 sec
                <br><br>
            </div>
            <div class='back' onclick="hideInfo()">⮌ Back</div>
        </div>
        <div id="listen" class="hidden">
            <div class="text">
                <a href="https://open.spotify.com/album/7j4j2jHN3ka9H1YfX9xwNZ?si=X2DGmN2_Srqjv4v9RtYdnQ" target="_top"><i class="fa fa-spotify"></i> Spotify</a>
            </div>
            <br><br>
            <div class="text">
                <a href="https://music.youtube.com/playlist?list=OLAK5uy_nZY0QYWaKLVwuTO8nJmoAhNJu3-IiJKtQ&si=ipKPeShPX0xsF3yJ" target="_top"><i class="fa fa-youtube-play"></i> YouTube</a>
            </div>
            <br><br>
            <div class="text">
                <a href="https://music.apple.com/us/album/aerogel-angels-ep-ep/1748801158" target="_top">🎜 Apple Music</a>
            </div>
            <div class='back' onclick="hideListen()">⮌ Back</div>
        </div>
        <div id="stems" class="hidden">
            <div class="link">Coming soon!</div>
            <br>
            <div class='back' onclick="hideStems()">⮌ Back</div>
        </div>
    </div>
</body>
