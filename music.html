<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/music.css">
        <link rel="stylesheet" href="css/fonts.css">
        <link rel="icon" type="image/x-icon" href="css/images/favicon.png">
        <script defer src="dropbar.js"></script>
        <script defer src="albumanim.js"></script>
        <title>catalog</title>
    </head>
    <body onload="unblur()" class="music">
        <div id="warnMobile">
            <img src="">
        </div>
        <div id="content">
            <div class="button" id="leftButton">
                <img class="arrow_button" src="css\images\arrow.png">
            </div>
            <div class="button" id="rightButton">
                <img class="arrow_button" src="css\images\arrowRight.png">
            </div>
            <div class="album a0" id="ep">
                <img class="cover" src="css\images\Aerogel Angels EP_album_cover.jpg">
                <div class="albumData" id="chrysInfo">
                    <div class="overlay">
                        <iframe src="epinfo/ep.html" class="info_page"></iframe>
                        <div class='right_bar'></div>
                        <div class='left_bar'></div>
                        <div class='bottom_bar'></div>
                    </div>
                    <div class="top_bar">
                        <img class="xbutton" src="css/images/xbutton.png">                             
                    </div>
                </div>
            </div>
            <div class="album a1" id="ic">
                <img class="cover" src="css\images\infini2.png">
                <div class="albumData" id="chrysInfo">
                    <div class="overlay">
                        <iframe src="chrysalisinfo/chrysalis.html" class="info_page"></iframe>
                        <div class='right_bar'></div>
                        <div class='left_bar'></div>
                        <div class='bottom_bar'></div>
                    </div>
                    <div class="top_bar">
                        <img class="xbutton" src="css/images/xbutton.png">                             
                    </div>
                </div>
            </div>
            <div class="album a2" id="comingsoon">
                <img class="cover" src="css\images\interro.png" style="opacity:0.5;filter:blur(1px)">
                <div class="albumData" id="chrysInfo">
                    <div class="overlay">
                        <iframe src="comingsoon/comingsoon.html" class="info_page"></iframe>
                        <div class='right_bar'></div>
                        <div class='left_bar'></div>
                        <div class='bottom_bar'></div>
                    </div>
                    <div class="top_bar">
                        <img class="xbutton" src="css/images/xbutton.png">                             
                    </div>
                </div>
            </div>
        </div>
        <div class="dropdown" id="dropdown">
            <div id="arrowContainer">
                <img id="arrow" src="css/images/arrowDown.png">
            </div>
            <div id="pulltab" onclick="dropBar()">
            </div>
            <div class="navbar">
                <div class="buttons">
                    <a href="https://aerogelangels.net/about">
                        <div class="navtext" id="toAbout"><b>about</b></div>
                    </a>
                    <a href="https://aerogelangels.net">
                        <div class="navtext" id="toHome"><b>home</b></div> 
                    </a>
                    <a href="https://aerogelangels.net/underconstruction">
                        <div class="navtext" id="toNow"><b>now</b></div>
                    </a>
                    <a href="https://aerogelangels.net/fun">
                        <div class="navtext" id="toFun"><b>fun</b></div>
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
