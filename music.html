<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/music.css">
        <link rel="stylesheet" href="css/fonts.css">
        <link rel="icon" type="image/x-icon" href="css/images/favicon.png">
        <script defer src="dropbar.js"></script>
        <script defer src="albumanim.js"></script>
        <title>catalog</title>
    </head>
    <body onload="unblur()" class="music">
        <div id="content">
            <div class="button" id="leftButton" onclick="cycleAlbumsRight()">
                <img class="arrow_button" src="css\images\arrow.png">
            </div>
            <div class="button" id="rightButton" onclick="cycleAlbumsLeft()">
                <img class="arrow_button" src="css\images\arrowRight.png">
            </div>
            <div class="album" id="zero">
                <div class="text" id="epInfo">
                </div>
                <img class="cover" src="css\images\Aerogel Angels EP_album_cover.jpg">
            </div>
            <div class="album" id="one">
                <div class="text" id="chrysInfo">
                </div>
                <img class="cover" src="css\images\infini2.png">
            </div>
            <div class="album" id="two">
                <div class="text" id="soonInfo">
                </div>
                <img class="cover" src="css\images\interro.png" style="opacity:0.5;filter:blur(1px)">
            </div>
        </div>
        <div class="dropdown" id="dropdown">
            <div id="arrowContainer">
                <img id="arrow" src="css/images/arrowDown.png">
            </div>
            <div id="pulltab" onclick="dropBar()">
            </div>
            <div class="navbar">
                <div class="buttons">
                    <a href="about.html">
                        <div class="navtext" id="toAbout"><b>about</b></div>
                    </a>
                    <a href="index.html">
                        <div class="navtext" id="toHome"><b>home</b></div> 
                    </a>
                    <a href="underconstruction.html">
                        <div class="navtext" id="toNow"><b>now</b></div>
                    </a>
                    <a href="fun.html">
                        <div class="navtext" id="toFun"><b>fun</b></div>
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
